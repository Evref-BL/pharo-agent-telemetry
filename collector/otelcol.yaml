          - "set(attributes[\"process.runtime.name\"], \"****\") where IsString(attributes[\"process.runtime.name\"]) and IsMatch(attributes[\"process.runtime.name\"], \"(?s)^.*[A-Za-z0-9._%+-]@[A-Za-z0-9.-]+\\\\.[A-Za-z]{2}.*$\")"
