# The collector: Caddy terminates TLS and passes /v1/traces on, and serves
# the catalog `pharo-agent-telemetry sign-catalog` signed into ./published; the
# OpenTelemetry Collector keeps what the allowlist allows and writes it to
# ./archive, one file a day, where the import job collects it; the guard
# makes Caddy refuse new spans while the archive is over its cap.
name: pharo-agent-telemetry

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - guard:/guard:ro
      - ${PUBLISHED_DIR:-./published}:/published:ro
    depends_on:
      - otelcol
    logging: &logs
      driver: local
      options:
        max-size: "1m"
        max-file: "3"

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otelcol.yaml"]
    environment:
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?set COLLECTOR_TOKEN in .env}
      SAMPLING_PERCENTAGE: ${SAMPLING_PERCENTAGE:-100}
      ID_HASH_KEY: ${ID_HASH_KEY:?start with ./start.sh, or set ID_HASH_KEY}
    user: "${ARCHIVE_UID:-10001}:${ARCHIVE_GID:-10001}"
    volumes:
      - ./otelcol.yaml:/etc/otelcol/otelcol.yaml:ro
      - ${ARCHIVE_DIR:-./archive}:/archive
    logging: *logs
    deploy:
      resources:
        limits:
          memory: 512M

  # A shell loop: Caddy's image has the shell and du it needs, and is pinned.
  guard:
    image: caddy:2.11.9
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/guard.sh"]
    environment:
      ARCHIVE_MAX_MB: ${ARCHIVE_MAX_MB:?start with ./start.sh, or set ARCHIVE_MAX_MB}
      GUARD_INTERVAL: ${GUARD_INTERVAL:-30}
    volumes:
      - ./guard.sh:/guard.sh:ro
      - ${ARCHIVE_DIR:-./archive}:/archive:ro
      - guard:/guard
    logging: *logs

volumes:
  caddy-data:
  caddy-config:
  guard:
