# The collector: Caddy terminates TLS and passes /v1/traces on, the
# OpenTelemetry Collector keeps what the allowlist allows and writes it to
# ./archive, where the import job collects it.
name: pharo-agent-telemetry

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - otelcol
    logging: &logs
      driver: local
      options:
        max-size: "1m"
        max-file: "3"

  otelcol:
    image: otel/opentelemetry-collector-contrib:0.164.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol/otelcol.yaml"]
    environment:
      COLLECTOR_TOKEN: ${COLLECTOR_TOKEN:?set COLLECTOR_TOKEN in .env}
      SAMPLING_PERCENTAGE: ${SAMPLING_PERCENTAGE:-100}
      ARCHIVE_MAX_FILES: ${ARCHIVE_MAX_FILES:?start with ./start.sh, or set ARCHIVE_MAX_FILES}
    user: "${ARCHIVE_UID:-10001}:${ARCHIVE_GID:-10001}"
    volumes:
      - ./otelcol.yaml:/etc/otelcol/otelcol.yaml:ro
      - ${ARCHIVE_DIR:-./archive}:/archive
    logging: *logs
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  caddy-data:
  caddy-config:
