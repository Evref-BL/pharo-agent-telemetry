          - "delete_key(attributes, \"os.type\") where not IsString(attributes[\"os.type\"])"
          - "set(attributes[\"os.type\"], \"****\") where IsString(attributes[\"os.type\"]) and IsMatch(attributes[\"os.type\"], \"(?is)^.*(/Users/|/home/|[A-Z]:\\\\\\\\Users\\\\\\\\).*$\")"
