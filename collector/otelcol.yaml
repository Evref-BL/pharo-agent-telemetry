          - "set(attributes[\"process.runtime.name\"], \"****\") where IsString(attributes[\"process.runtime.name\"]) and IsMatch(attributes[\"process.runtime.name\"], \"(?is)^.*(?:::|\\\\b[0-9a-f]{1,4}(?::[0-9a-f]{1,4}){7}\\\\b).*$\")"
          - "delete_key(attributes, \"process.runtime.name\") where IsString(attributes[\"process.runtime.name\"]) and not IsMatch(attributes[\"process.runtime.name\"], \"^(?:nodejs|pharo)$\")"
          - "delete_key(attributes, \"process.runtime.version\") where not IsString(attributes[\"process.runtime.version\"])"
          - "set(attributes[\"process.runtime.version\"], \"****\") where IsString(attributes[\"process.runtime.version\"]) and IsMatch(attributes[\"process.runtime.version\"], \"(?is)^.*(/Users/|/home/|[A-Z]:\\\\\\\\Users\\\\\\\\).*$\")"
